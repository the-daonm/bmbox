# End-to-end test against real libvirt, on a self-hosted runner: a KVM host
# with sudo and the bmbox tools (run `sudo bmbox setup` on it once), with
# the labels below. It brings up and destroys its own lab only.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, linux, kvm, bmbox-e2e]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make e2e
