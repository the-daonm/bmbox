site_name: bmbox
site_description: Virtual bare-metal labs from a single YAML file.
site_url: https://the-daonm.github.io/bmbox/
repo_url: https://github.com/the-daonm/bmbox
repo_name: the-daonm/bmbox
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quick start: quickstart.md
  - Reference:
      - Commands: commands.md
      - Topology: topology.md
      - BMCs: bmcs.md
      - DHCP and netboot: netboot.md
      - Firewall: firewall.md
      - After a reboot: reboot.md
      - Files: files.md
  - Project:
      - Development: development.md
      - Changelog: changelog.md
