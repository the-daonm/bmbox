# bmbox topology: two UEFI "bare-metal" nodes on an isolated PXE network
# (with DHCP from bmbox) plus a separate data network.
apiVersion: bmbox.io/v1alpha1
kind: Topology
metadata:
  name: demo
spec:
  defaults:
    cpus: 2
    memory: 4GiB
    boot: [network, disk]   # PXE first, like a real server waiting for provisioning

  # Directory as seen by libvirtd. Defaults to /var/lib/libvirt/bmbox/<name>.
  # storage:
  #   path: /var/lib/libvirt/bmbox/demo

  # Bring the lab back when the host reboots (default true).
  # autostart: false

  # Leave empty to let libvirt (domain capabilities) pick the OVMF firmware.
  # uefi:
  #   loader: /usr/share/OVMF/OVMF_CODE_4M.fd
  #   varsTemplate: /usr/share/OVMF/OVMF_VARS_4M.fd

  networks:
    - name: pxe
      cidr: 172.30.10.0/24   # host gets 172.30.10.1 on the bridge
      dhcp: {}               # bmbox's dnsmasq hands out 172.30.10.2-254
    - name: data             # pure L2 segment, no host address

  # What PXE-booting nodes boot (via iPXE). Without it, DHCP only hands out
  # addresses and PXE falls through to the disk.
  # netboot:
  #   kernel: /srv/netboot/vmlinuz      # absolute path or http(s) URL
  #   initrd: /srv/netboot/initrd.img
  #   cmdline: console=ttyS0

  nodes:
    - name: node1
      memory: 8GiB
      disks:
        - size: 40GiB
        - size: 10GiB
      nics:
        - network: pxe
          ip: 172.30.10.11     # fixed DHCP address
        - network: data
      bmc:
        type: redfish        # HTTPS by default; trust /var/lib/bmbox/ca/ca.crt
        # tls: false         # plain HTTP instead
        # No password: one is generated and kept (sudo bmbox credentials).

    - name: node2
      nics:
        - network: pxe
          mac: "52:54:00:aa:00:02"
      bmc:
        type: ipmi
        port: 6231
        # passwordEnv: NODE2_BMC_PASSWORD   # or passwordFile: /etc/bmbox/node2.pw
